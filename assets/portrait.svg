<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
<title>Blueskyちゃんの自画像</title><desc>公式プロフィール画像を参照した、灰青色の長い髪と大きな帽子、青い花の瞳の肖像。</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102d48"/><stop offset=".55" stop-color="#166d95"/><stop offset="1" stop-color="#1a3c56"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#779da6"/><stop offset=".42" stop-color="#918b9e"/><stop offset=".75" stop-color="#71849a"/><stop offset="1" stop-color="#a8e0d4"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#ffe5db"/><stop offset=".48" stop-color="#f7c9bd"/><stop offset="1" stop-color="#e8ad9f"/></linearGradient>
 <radialGradient id="iris"><stop stop-color="#5bc9ed"/><stop offset=".7" stop-color="#1987c4"/><stop offset="1" stop-color="#225578"/></radialGradient>
 <linearGradient id="hat" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f8e6d4"/><stop offset=".23" stop-color="#e7b7bc"/><stop offset=".6" stop-color="#a99b95"/><stop offset="1" stop-color="#c9b6ad"/></linearGradient>
</defs>
<!-- AT Protocolにちなむ巨大な@。人物と帽子の背後で画面外へ続く -->
